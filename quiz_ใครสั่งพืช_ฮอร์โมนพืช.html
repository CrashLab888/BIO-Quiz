<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ใครสั่งพืช? — แบบทดสอบฮอร์โมนพืช</title>
<style>
:root{
  --orange:#ff5a00;
  --orange2:#ff7a00;
  --black:#111;
  --white:#f7f5f0;
  --gray:#d8d5ce;
  --muted:#777;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--white);color:var(--black);
  font-family:Arial,"Noto Sans Thai",sans-serif;
}
header{
  background:var(--black);color:white;padding:18px 5vw;
  display:flex;justify-content:space-between;align-items:center;
  border-bottom:6px solid var(--orange);
}
.brand{font-weight:900;letter-spacing:-1px}
.brand span{color:var(--orange)}
.counter{font-weight:800}
main{max-width:920px;margin:auto;padding:42px 22px 80px}
.hero{min-height:58vh;display:flex;flex-direction:column;justify-content:center}
.kicker{color:var(--orange);font-weight:900;font-size:14px;letter-spacing:2px}
h1{font-size:clamp(48px,10vw,100px);line-height:.88;margin:14px 0}
h2{font-size:clamp(28px,5vw,52px);line-height:1.05;margin:10px 0 28px}
p{font-size:18px;line-height:1.7}
button{
  border:0;cursor:pointer;font:inherit;font-weight:900;
}
.start,.next,.restart{
  background:var(--orange);color:white;padding:16px 24px;margin-top:18px;
  display:inline-block;transition:.15s;
}
.start:hover,.next:hover,.restart:hover{background:#000}
.hidden{display:none!important}
.progress-wrap{height:8px;background:#ddd;margin-bottom:36px}
.progress{height:100%;background:var(--orange);width:0;transition:.3s}
.question-meta{display:flex;justify-content:space-between;color:var(--muted);font-weight:800}
.options{display:grid;gap:12px;margin-top:24px}
.option{
  background:white;border:2px solid #222;text-align:left;padding:18px 20px;
  display:flex;gap:16px;align-items:flex-start;transition:.15s;
}
.option:hover{transform:translateX(4px);border-color:var(--orange)}
.option .letter{
  min-width:32px;height:32px;background:var(--black);color:white;
  display:grid;place-items:center;font-weight:900
}
.option.correct{border-color:#16843b;background:#eaf7ef}
.option.wrong{border-color:#c52222;background:#fff0f0}
.option.disabled{pointer-events:none}
.feedback{
  margin-top:18px;padding:18px;background:#111;color:white;
  border-left:7px solid var(--orange);line-height:1.6
}
.next{display:none}
.result{text-align:center;padding:60px 0}
.score{font-size:100px;font-weight:900;line-height:1}
.score span{color:var(--orange)}
.result-card{
  margin:30px auto;padding:24px;background:#111;color:white;
  max-width:560px;text-align:left;border-left:8px solid var(--orange)
}
.small{font-size:14px;color:#777}
footer{text-align:center;color:#888;font-size:13px;padding:30px}
</style>
</head>
<body>

<header>
  <div class="brand">ใครสั่งพืช? <span>THE SERIES</span></div>
  <div class="counter" id="counter">10 QUESTIONS</div>
</header>

<main>
<section id="intro" class="hero">
  <div class="kicker">BIOLOGY M.5 / PLANT HORMONES</div>
  <h1>ใครสั่ง<br><span style="color:var(--orange)">พืช?</span></h1>
  <h2>แบบทดสอบฮอร์โมนพืช 10 ข้อ</h2>
  <p>ออกซิน · ไซโทไคนิน · จิบเบอเรลลิน · เอทิลีน · กรดแอบไซซิก</p>
  <button class="start" onclick="startQuiz()">เริ่มการทดสอบ →</button>
</section>

<section id="quiz" class="hidden">
  <div class="progress-wrap"><div id="progress" class="progress"></div></div>
  <div class="question-meta">
    <span id="qnum"></span><span id="topic"></span>
  </div>
  <h2 id="question"></h2>
  <div id="options" class="options"></div>
  <div id="feedback" class="feedback hidden"></div>
  <button id="next" class="next" onclick="nextQuestion()">ข้อถัดไป →</button>
</section>

<section id="result" class="hidden result">
  <div class="kicker">RESULT</div>
  <div class="score"><span id="score">0</span>/10</div>
  <h2 id="resultTitle"></h2>
  <div class="result-card" id="resultText"></div>
  <button class="restart" onclick="location.reload()">ทำแบบทดสอบอีกครั้ง ↻</button>
</section>
</main>

<footer>ใครสั่งพืช? THE SERIES · Biology M.5</footer>

<script>
const questions = [
{topic:"AUXIN",q:"ฮอร์โมนพืชกลุ่มใดมีบทบาทเด่นในการกระตุ้นการยืดตัวของเซลล์และเกี่ยวข้องกับการโค้งเข้าหาแสงของยอด?",
a:["ออกซิน","ไซโทไคนิน","เอทิลีน","กรดแอบไซซิก"],c:0,
f:"ออกซินกระตุ้นการยืดตัวของเซลล์และมีบทบาทสำคัญต่อการตอบสนองของยอดต่อแสง."},
{topic:"CYTOKININ",q:"ฮอร์โมนใดมีบทบาทสำคัญในการกระตุ้นการแบ่งเซลล์และช่วยชะลอการเสื่อมของใบ?",
a:["จิบเบอเรลลิน","ไซโทไคนิน","เอทิลีน","ออกซิน"],c:1,
f:"ไซโทไคนินส่งเสริมการแบ่งเซลล์และช่วยชะลอการเสื่อมสภาพของใบ."},
{topic:"GIBBERELLIN",q:"ฮอร์โมนใดมีบทบาทสำคัญต่อการยืดตัวของลำต้นและการกระตุ้นการงอกของเมล็ด?",
a:["กรดแอบไซซิก","เอทิลีน","จิบเบอเรลลิน","ไซโทไคนิน"],c:2,
f:"จิบเบอเรลลินส่งเสริมการยืดตัวของลำต้นและมีบทบาทในการกระตุ้นการงอก."},
{topic:"ETHYLENE",q:"ข้อใดอธิบายเอทิลีนได้ถูกต้องที่สุด?",
a:["เป็นฮอร์โมนในรูปก๊าซที่เกี่ยวข้องกับการสุกของผลไม้","เป็นฮอร์โมนที่ทำหน้าที่หลักในการปิดปากใบ","เป็นฮอร์โมนที่ทำหน้าที่หลักในการแบ่งเซลล์","เป็นฮอร์โมนที่ทำหน้าที่หลักในการยืดตัวของเซลล์"],c:0,
f:"เอทิลีนเป็นฮอร์โมนพืชในรูปก๊าซและมีบทบาทสำคัญต่อการสุกของผลไม้."},
{topic:"ABA",q:"เมื่อพืชเผชิญภาวะขาดน้ำ ฮอร์โมนใดมีบทบาทสำคัญในการกระตุ้นการปิดปากใบ?",
a:["ออกซิน","ไซโทไคนิน","กรดแอบไซซิก","จิบเบอเรลลิน"],c:2,
f:"กรดแอบไซซิกช่วยกระตุ้นการปิดปากใบเมื่อพืชเผชิญภาวะขาดน้ำ."},
{topic:"APPLICATION",q:"การใช้ฮอร์โมนเพื่อช่วยกระตุ้นการเกิดรากในกิ่งปักชำเกี่ยวข้องกับฮอร์โมนกลุ่มใดมากที่สุด?",
a:["ออกซิน","เอทิลีน","กรดแอบไซซิก","จิบเบอเรลลิน"],c:0,
f:"ออกซินมีบทบาทสำคัญในการส่งเสริมการเกิดรากและใช้ประโยชน์ในการปักชำ."},
{topic:"APPLICATION",q:"การเพาะเลี้ยงเนื้อเยื่อพืชใช้ประโยชน์จากไซโทไคนินอย่างไร?",
a:["ส่งเสริมการแบ่งเซลล์และการเกิดยอด","เร่งการสุกของผลไม้","กระตุ้นการปิดปากใบ","เร่งการยืดตัวของลำต้นเป็นหลัก"],c:0,
f:"ไซโทไคนินส่งเสริมการแบ่งเซลล์และมีบทบาทต่อการพัฒนาของยอดในการเพาะเลี้ยงเนื้อเยื่อ."},
{topic:"COMPARE",q:"ข้อใดจับคู่ฮอร์โมนกับหน้าที่ได้ถูกต้อง?",
a:["เอทิลีน — การสุกของผลไม้","ABA — การกระตุ้นการงอกของเมล็ด","ไซโทไคนิน — การปิดปากใบเมื่อขาดน้ำ","จิบเบอเรลลิน — การเร่งการหลุดร่วงของใบ"],c:0,
f:"เอทิลีนมีบทบาทสำคัญในการควบคุมกระบวนการสุกของผลไม้."},
{topic:"ABA / SEED",q:"ข้อใดอธิบายความสัมพันธ์ระหว่าง ABA กับเมล็ดพืชได้ถูกต้อง?",
a:["ส่งเสริมภาวะพักตัวของเมล็ด","ทำให้เมล็ดงอกโดยตรงเป็นหน้าที่หลัก","ทำให้ผลไม้สุกโดยตรงเป็นหน้าที่หลัก","กระตุ้นการแบ่งเซลล์เป็นหน้าที่หลัก"],c:0,
f:"ABA มีบทบาทสำคัญในการส่งเสริมและคงภาวะพักตัวของเมล็ด."},
{topic:"SUMMARY",q:"ข้อใดสรุปบทบาทของฮอร์โมนพืชทั้ง 5 กลุ่มได้ถูกต้อง?",
a:["ออกซิน–ยืด/ทิศทาง, ไซโทไคนิน–แบ่งเซลล์, จิบเบอเรลลิน–ยืด/งอก, เอทิลีน–สุก/ร่วง, ABA–ปิดปากใบ/พักตัว",
"ออกซิน–สุก, ไซโทไคนิน–ปิดปากใบ, จิบเบอเรลลิน–ร่วง, เอทิลีน–แบ่งเซลล์, ABA–ยืด",
"ออกซิน–พักตัว, ไซโทไคนิน–สุก, จิบเบอเรลลิน–ปิดปากใบ, เอทิลีน–ยืด, ABA–แบ่งเซลล์",
"ออกซิน–แบ่งเซลล์, ไซโทไคนิน–งอก, จิบเบอเรลลิน–สุก, เอทิลีน–ปิดปากใบ, ABA–ยืด"],c:0,
f:"การจับคู่นี้สอดคล้องกับบทบาทเด่นของฮอร์โมนทั้งห้ากลุ่ม."}
];

let current=0, score=0, answered=false;

function startQuiz(){
  document.getElementById("intro").classList.add("hidden");
  document.getElementById("quiz").classList.remove("hidden");
  render();
}
function render(){
  answered=false;
  const x=questions[current];
  document.getElementById("qnum").textContent=`QUESTION ${String(current+1).padStart(2,"0")} / 10`;
  document.getElementById("topic").textContent=x.topic;
  document.getElementById("question").textContent=x.q;
  document.getElementById("progress").style.width=((current)/questions.length*100)+"%";
  document.getElementById("feedback").classList.add("hidden");
  document.getElementById("next").style.display="none";
  const box=document.getElementById("options"); box.innerHTML="";
  x.a.forEach((label,i)=>{
    const b=document.createElement("button");
    b.className="option";
    b.innerHTML=`<span class="letter">${String.fromCharCode(65+i)}</span><span>${label}</span>`;
    b.onclick=()=>choose(i,b);
    box.appendChild(b);
  });
}
function choose(i,btn){
  if(answered)return;
  answered=true;
  const x=questions[current];
  document.querySelectorAll(".option").forEach((b,n)=>{
    b.classList.add("disabled");
    if(n===x.c)b.classList.add("correct");
  });
  if(i===x.c){score++;}else{btn.classList.add("wrong");}
  document.getElementById("feedback").textContent=x.f;
  document.getElementById("feedback").classList.remove("hidden");
  document.getElementById("next").style.display="inline-block";
  document.getElementById("next").textContent=current===questions.length-1?"ดูผลคะแนน →":"ข้อถัดไป →";
}
function nextQuestion(){
  if(!answered)return;
  current++;
  if(current>=questions.length){showResult();return;}
  render();
}
function showResult(){
  document.getElementById("quiz").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");
  document.getElementById("score").textContent=score;
  let title,text;
  if(score>=9){
    title="เข้าใจระบบสัญญาณของพืชแล้ว";
    text="คุณเชื่อมโยงฮอร์โมนกับหน้าที่และการประยุกต์ใช้ได้ดีมาก";
  }else if(score>=7){
    title="พื้นฐานแน่น";
    text="คุณเข้าใจภาพรวมได้ดี ลองทบทวนบทบาทของแต่ละฮอร์โมนอีกครั้ง";
  }else if(score>=5){
    title="เริ่มเห็นภาพแล้ว";
    text="ลองกลับไปดูคำสำคัญของฮอร์โมนทั้ง 5 กลุ่ม แล้วทำใหม่อีกครั้ง";
  }else{
    title="กลับไปที่หลักฐาน";
    text="ทบทวน 5 คำหลัก: ยืด · แบ่ง · งอก · สุก · ปิด แล้วลองอีกครั้ง";
  }
  document.getElementById("resultTitle").textContent=title;
  document.getElementById("resultText").textContent=text;
}
</script>
</body>
</html>
